name: Build CafeBazaar AAB + APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '*.apk'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "ndk;30.0.15729638"

      - name: Prepare CI signing key
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/cafebazaar-signing"
          KEYSTORE="$KEY_DIR/release-upload.keystore"
          mkdir -p "$KEY_DIR"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass changeit \
            -keypass changeit \
            -alias cafebazaar-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CafeBazaar CI, OU=Build, O=KianStore, L=Tehran, ST=Tehran, C=IR"
          chmod 600 "$KEYSTORE"
          echo "CI_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CI_KEYSTORE_PASSWORD=changeit" >> "$GITHUB_ENV"
          echo "CI_KEY_ALIAS=cafebazaar-ci" >> "$GITHUB_ENV"
          echo "CI_KEY_PASSWORD=changeit" >> "$GITHUB_ENV"

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify AAB and APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/bundle/release/app-release.aab
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Copy APK to project root
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk takhfif_module-release.apk

      - name: Commit APK to project root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add takhfif_module-release.apk
          if git diff --cached --quiet; then
            echo "APK is already up to date."
            exit 0
          fi
          git commit -m "build: add release APK [skip ci]"
          git push origin HEAD:master

      - name: Upload CafeBazaar AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: takhfif_module-release-1.0.3+4
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

# AAB and APK are signed in CI with a temporary Linux-local signing key.
# The APK is also committed to the repository root as takhfif_module-release.apk.
